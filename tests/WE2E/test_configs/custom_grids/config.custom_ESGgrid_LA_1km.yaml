metadata:
  description: |-
    This test checks the capability of the workflow to have the user
    specify a new grid (as opposed to one of the predefined ones in the
    workflow) of ESGgrid type.
user:
  RUN_ENVIR: community
workflow:
  CCPP_PHYS_SUITE: FV3_WoFS_v0
  GRID_GEN_METHOD: ESGgrid
  DATE_FIRST_CYCL: '2025010618'
  DATE_LAST_CYCL: '2025010618'
  FCST_LEN_HRS: 84
  PREEXISTING_DIR_METHOD: rename
task_make_grid:
  ESGgrid_LON_CTR: -118.75
  ESGgrid_LAT_CTR: 34.5
  ESGgrid_DELX: 1000.0
  ESGgrid_DELY: 1000.0
  ESGgrid_NX: 310
  ESGgrid_NY: 300
  ESGgrid_WIDE_HALO_WIDTH: 6
  ESGgrid_PAZI: 0.0
task_get_extrn_ics:
  envvars:
    EXTRN_MDL_NAME_ICS: HRRR
    USE_USER_STAGED_EXTRN_FILES: false
    EXTRN_MDL_FILES_ICS:
      - '{yy}{jjj}{hh}00{fcst_hr:02d}00'
task_get_extrn_lbcs:
  envvars:
    EXTRN_MDL_NAME_LBCS: HRRR
    LBC_SPEC_INTVL_HRS: 1
    USE_USER_STAGED_EXTRN_FILES: false
    EXTRN_MDL_FILES_LBCS:
      - '{yy}{jjj}{hh}00{fcst_hr:02d}00'
    EXTRN_MDL_LBCS_MAX_FCST_HRS: 48
    EXTRN_MDL_LBCS_BRIDGE_INTVL_HRS: 48
task_make_ics:
  chgres_cube:
    execution:
      batchargs:
        nodes: 1
        tasks_per_node: 12
task_run_fcst:
  envvars:
    DT_ATMOS: 15
  fv3:
    execution:
      batchargs:
        walltime: 03:00:00
  LAYOUT_X: 10
  LAYOUT_Y: 10
  BLOCKSIZE: 35
  QUILTING: true
  WRTCMP_write_groups: 1
  WRTCMP_write_tasks_per_group: 2
  WRTCMP_output_grid: lambert_conformal
  WRTCMP_cen_lon: !float '{{ task_make_grid.ESGgrid_LON_CTR }}'
  WRTCMP_cen_lat: !float '{{ task_make_grid.ESGgrid_LAT_CTR }}'
  WRTCMP_lon_lwr_left: -119.25
  WRTCMP_lat_lwr_left: 33.50
  WRTCMP_stdlat1: !float '{{ task_make_grid.ESGgrid_LAT_CTR }}'
  WRTCMP_stdlat2: !float '{{ task_make_grid.ESGgrid_LAT_CTR }}'
  WRTCMP_nx: 150
  WRTCMP_ny: 150
  WRTCMP_dx: !float '{{ task_make_grid.ESGgrid_DELX }}'
  WRTCMP_dy: !float '{{ task_make_grid.ESGgrid_DELY }}'
task_run_post:
  envvars:
    POST_OUTPUT_DOMAIN_NAME: custom_ESGgrid_CalFireArea
