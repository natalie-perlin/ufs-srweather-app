metadata:
  description: 
    Sample community case
user:
  RUN_ENVIR: community
  MACHINE: macos
  ACCOUNT: an_account
workflow:
  CCPP_PHYS_SUITE: RRFS_sas
  PREDEF_GRID_NAME: SUBCONUS_Ind_3km
  DATE_FIRST_CYCL: '2020081000'
  DATE_LAST_CYCL: '2020081000'
  FCST_LEN_HRS: 3
  PREEXISTING_DIR_METHOD: rename
  COMPILER: gnu
  EXPT_SUBDIR: grid_SUBCONUS_Ind_3km_ics_RRFS_sas
task_get_extrn_ics:
  EXTRN_MDL_NAME_ICS: HRRR
  USE_USER_STAGED_EXTRN_FILES: true
  EXTRN_MDL_FILES_ICS:
  - '{yy}{jjj}{hh}00{fcst_hr:02d}00'
  EXTRN_MDL_SOURCE_BASEDIR_ICS: /Users/Natalie/UFS_SRW_data/develop/input_model_data/HRRR/${yyyymmddhh}
task_get_extrn_lbcs:
  EXTRN_MDL_NAME_LBCS: HRRR
  LBC_SPEC_INTVL_HRS: 3
  USE_USER_STAGED_EXTRN_FILES: true
  EXTRN_MDL_FILES_LBCS:
  - '{yy}{jjj}{hh}00{fcst_hr:02d}00'
  EXTRN_MDL_SOURCE_BASEDIR_LBCS: /Users/Natalie/UFS_SRW_data/develop/input_model_data/HRRR/${yyyymmddhh}
global:
  DO_ENSEMBLE: false
  NUM_ENS_MEMBERS: 1
  DO_SHUM: true
  DO_SPPT: true
  DO_SKEB: true
  DO_SPP: true
platform:
  BUILD_MOD_FN: build_macos_gnu
  EXTRN_MDL_DATA_STORES: disk
task_run_fcst:
  OMP_NUM_THREADS_RUN_FCST: 1
  QUILTING: true
  LAYOUT_X: 1
  LAYOUT_Y: 7
  BLOCKSIZE: 40
  QUILTING: true
  WRTCMP_write_groups: 1
  WRTCMP_write_tasks_per_group: 1
task_plot_allvars:
  COMOUT_REF: ""
rocoto:
  tasks:
    taskgroups: '{{ ["parm/wflow/prep.yaml", "parm/wflow/coldstart.yaml", "parm/wflow/post.yaml", "parm/wflow/plot.yaml" ]|include }}'
    metatask_run_ensemble:
      task_run_fcst_mem#mem#:
        walltime: 10:00:00
  task_plot_allvars:
    PLOT_FCST_START: 0
    PLOT_FCST_INC: 1
    PLOT_FCST_END: 3
